# ==============================================================================
# Workload Definition File (WDF) v2 - VoiceRAG with Two Scenarios
# ==============================================================================
# This WDF deploys the VoiceRAG application to Azure Container Apps with
# two scenarios for profiling comparison:
# - S1 (native): Baseline with gpt-4o-mini
# - S2 (alternate): Higher quality with gpt-4o
# ==============================================================================

apiVersion: wdf.7sg.ai/v2
kind: WorkloadDefinition
metadata:
  name: voicerag-aisearch
  description: VoiceRAG application with RAG support using voice interface - Two scenarios for profiling
  tags:
    env: prod

security:
  policies:
    secretsInEnvAllowed: true

secrets:
  provider: azureKeyVault
  secretRefs:
    - name: azure-openai-endpoint
      injectAs: env
      envVar: AZURE_OPENAI_ENDPOINT
      externalRef:
        key: azure-openai-endpoint
    - name: azure-openai-api-key
      injectAs: env
      envVar: AZURE_OPENAI_API_KEY
      externalRef:
        key: azure-openai-api-key
    - name: azure-search-endpoint
      injectAs: env
      envVar: AZURE_SEARCH_ENDPOINT
      externalRef:
        key: azure-search-endpoint
    - name: azure-search-api-key
      injectAs: env
      envVar: AZURE_SEARCH_API_KEY
      externalRef:
        key: azure-search-api-key
    - name: azure-search-index
      injectAs: env
      envVar: AZURE_SEARCH_INDEX
      externalRef:
        key: azure-search-index
    - name: azure-storage-account-name
      injectAs: env
      envVar: AZURE_STORAGE_ACCOUNT_NAME
      externalRef:
        key: azure-storage-account-name
    - name: azure-storage-account-key
      injectAs: env
      envVar: AZURE_STORAGE_ACCOUNT_KEY
      externalRef:
        key: azure-storage-account-key
    - name: azure-storage-connection-string
      injectAs: env
      envVar: AZURE_STORAGE_CONNECTION_STRING
      externalRef:
        key: azure-storage-connection-string
    - name: azure-storage-container
      injectAs: env
      envVar: AZURE_STORAGE_CONTAINER
      externalRef:
        key: azure-storage-container
    - name: application-insights-instrumentation-key
      injectAs: env
      envVar: APPLICATIONINSIGHTS_CONNECTION_STRING
      externalRef:
        key: application-insights-instrumentation-key

scenarios:
  native:
    description: "S1 Baseline - VoiceRAG with gpt-4o-mini (cost-optimized)"
    topology:
      components:
        - name: voicerag-app-s1
          role: api
          runtime:
            platform: azure_container_apps
            regions:
              - eastus2
            image:
              registry: uvvoiceragacr.azurecr.io
              repository: voicerag-app
              tag: latest
            env:
              - name: PYTHONUNBUFFERED
                value: "1"
              - name: LOG_LEVEL
                value: INFO
              - name: PORT
                value: "8000"
              - name: API_HOST
                value: "0.0.0.0"
              - name: API_TITLE
                value: "VoiceRAG API - S1 Baseline"
              - name: API_VERSION
                value: "1.0.0"
              - name: AZURE_OPENAI_REALTIME_DEPLOYMENT
                value: gpt-realtime-mini
              - name: AZURE_OPENAI_CHAT_DEPLOYMENT
                value: gpt-4o-mini
              - name: AZURE_OPENAI_EMBEDDING_DEPLOYMENT
                value: text-embedding-3-large
              - name: AZURE_OPENAI_REALTIME_VOICE_CHOICE
                value: alloy
              - name: AZURE_OPENAI_API_VERSION
                value: "2024-02-15-preview"
              - name: AZURE_SEARCH_INDEX
                value: voicerag-intvect
              - name: AZURE_SEARCH_SEMANTIC_CONFIGURATION
                value: default
              - name: AZURE_SEARCH_IDENTIFIER_FIELD
                value: chunk_id
              - name: AZURE_SEARCH_CONTENT_FIELD
                value: chunk
              - name: AZURE_SEARCH_EMBEDDING_FIELD
                value: text_vector
              - name: AZURE_SEARCH_TITLE_FIELD
                value: title
              - name: AZURE_SEARCH_USE_VECTOR_QUERY
                value: "True"
              - name: RUNNING_IN_PRODUCTION
                value: "true"
              - name: TZ
                value: UTC
            envFromSecretRefs:
              - azure-openai-endpoint
              - azure-openai-api-key
              - azure-search-endpoint
              - azure-search-api-key
              - azure-search-index
              - azure-storage-account-name
              - azure-storage-account-key
              - azure-storage-connection-string
              - azure-storage-container
              - application-insights-instrumentation-key
            resources:
              cpu: "1.0"
              memory: "2Gi"
            autoscaling:
              minReplicas: 1
              maxReplicas: 10
              policy:
                metric: cpu
                target: 70
          endpoints:
            - name: http
              port: 8000
              exposure: public
              protocol: http
              path: /health
          dependsOn: []

    deployments:
      - name: azure-prod-s1-baseline
        target:
          provider: azure
          region: eastus2
          cluster: acaenv-sofia-frontend-tests
          namespace: s1-baseline
        components:
          - voicerag-app-s1

  alternates:
    - name: gpt-4o-highquality
      description: "S2 Alternate - VoiceRAG with gpt-4o (higher quality responses)"
      topology:
        components:
          - name: voicerag-app-s2
            role: api
            runtime:
              platform: azure_container_apps
              regions:
                - eastus2
              image:
                registry: uvvoiceragacr.azurecr.io
                repository: voicerag-app
                tag: latest
              env:
                - name: PYTHONUNBUFFERED
                  value: "1"
                - name: LOG_LEVEL
                  value: INFO
                - name: PORT
                  value: "8000"
                - name: API_HOST
                  value: "0.0.0.0"
                - name: API_TITLE
                  value: "VoiceRAG API - S2 GPT-4o"
                - name: API_VERSION
                  value: "1.0.0"
                - name: AZURE_OPENAI_REALTIME_DEPLOYMENT
                  value: gpt-realtime-mini
                - name: AZURE_OPENAI_CHAT_DEPLOYMENT
                  value: gpt-4o
                - name: AZURE_OPENAI_EMBEDDING_DEPLOYMENT
                  value: text-embedding-3-large
                - name: AZURE_OPENAI_REALTIME_VOICE_CHOICE
                  value: alloy
                - name: AZURE_OPENAI_API_VERSION
                  value: "2024-02-15-preview"
                - name: AZURE_SEARCH_INDEX
                  value: voicerag-intvect
                - name: AZURE_SEARCH_SEMANTIC_CONFIGURATION
                  value: default
                - name: AZURE_SEARCH_IDENTIFIER_FIELD
                  value: chunk_id
                - name: AZURE_SEARCH_CONTENT_FIELD
                  value: chunk
                - name: AZURE_SEARCH_EMBEDDING_FIELD
                  value: text_vector
                - name: AZURE_SEARCH_TITLE_FIELD
                  value: title
                - name: AZURE_SEARCH_USE_VECTOR_QUERY
                  value: "True"
                - name: RUNNING_IN_PRODUCTION
                  value: "true"
                - name: TZ
                  value: UTC
              envFromSecretRefs:
                - azure-openai-endpoint
                - azure-openai-api-key
                - azure-search-endpoint
                - azure-search-api-key
                - azure-search-index
                - azure-storage-account-name
                - azure-storage-account-key
                - azure-storage-connection-string
                - azure-storage-container
                - application-insights-instrumentation-key
              resources:
                cpu: "1.0"
                memory: "2Gi"
              autoscaling:
                minReplicas: 1
                maxReplicas: 10
                policy:
                  metric: cpu
                  target: 70
            endpoints:
              - name: http
                port: 8000
                exposure: public
                protocol: http
                path: /health
            dependsOn: []

      deployments:
        - name: azure-prod-s2-gpt4o
          target:
            provider: azure
            region: eastus2
            cluster: acaenv-sofia-frontend-tests
            namespace: s2-gpt4o
          components:
            - voicerag-app-s2
